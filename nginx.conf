server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte nativo a tipos MIME com foco em ES6 Modules (.js, .mjs)
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
    }

    # Cabeçalhos de segurança essenciais
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Desativa cache em desenvolvimento e avaliação do MVP para evitar respostas defasadas
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;

    # Roteamento SPA / Páginas HTML (aceita /musico, /musico.html, /bilhetinho, etc.)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Compressão gzip para melhor desempenho
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

