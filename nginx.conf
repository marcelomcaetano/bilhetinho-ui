server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte nativo a tipos MIME com foco em ES6 Modules (.js)
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        image/svg+xml svg;
    }

    # Cabeçalhos de segurança essenciais
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Roteamento SPA / Páginas HTML
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desativa cache excessivo em desenvolvimento e avaliação do MVP
    location ~* \.(?:css|js|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Compressão gzip para melhor desempenho
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
