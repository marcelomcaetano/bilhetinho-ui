<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilhetinho — Shows & Apresentações ao Vivo</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilo Customizado -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Barra de Navegação: Logo à esquerda, Link da Área do Músico à direita -->
    <nav class="navbar navbar-expand sticky-top">
        <div class="container">
            <!-- Canto Esquerdo: Logo do Sistema -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" title="Bilhetinho - Página Inicial">
                <i class="bi bi-music-note-beamed fs-4 text-purple"></i>
                <span class="brand-gradient fs-4">Bilhetinho</span>
            </a>

            <!-- Canto Direito: Link para acessar a Área do Músico -->
            <div class="d-flex align-items-center gap-2">
                <a href="musico.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2" id="linkAreaMusico" title="Acessar painel do músico">
                    <i class="bi bi-person-badge text-purple fs-6"></i>
                    <span class="fw-semibold">Área do Músico</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal: Apresentação dos Eventos Ativos -->
    <main class="container py-5">

        <!-- Cabeçalho da Seção de Shows Ativos -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-broadcast text-purple fs-4"></i>
                    <h1 class="h4 fw-bold mb-0 text-white">Shows & Eventos Ativos</h1>
                    <span id="badgeTotalAtivos" class="badge bg-purple-subtle text-purple border border-purple-subtle px-3 py-1">
                        0 shows
                    </span>
                </div>
                <p class="text-secondary small mb-0">
                    Acompanhe as apresentações ao vivo que estão acontecendo nos bares e palcos parceiros.
                </p>
            </div>

            <div>
                <button id="btnRecarregarAtivos" class="btn btn-outline-secondary btn-sm" title="Recarregar lista de shows ativos">
                    <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
                </button>
            </div>
        </div>

        <!-- Grid de Cards de Shows Ativos -->
        <div id="containerShowsAtivos" class="row g-4">
            <!-- Cards renderizados dinamicamente pelo js/app.js -->
        </div>

    </main>

    <!-- Toast Container para Notificações -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="homeToast" class="toast align-items-center text-bg-dark border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
                    <!-- Mensagem dinâmica -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script da Página Inicial de Shows Ativos -->
    <script type="module" src="js/app.js?v=2.0.0"></script>
</body>

</html>
